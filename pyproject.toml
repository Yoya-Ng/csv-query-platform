[project]
name = "csv-query-platform"
version = "0.1.0"
description = "大量 CSV 資料查詢平台（PoC）"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "psycopg[binary]",
  "psycopg-pool",
  "sqlalchemy>=2.0",
  "alembic",
  "python-multipart",
  "pydantic-settings",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: 需要 PostgreSQL（docker compose up db）"]
